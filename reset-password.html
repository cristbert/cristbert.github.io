<!DOCTYPE html>
<html lang="es">
<head>
    <script>
        // Idioma inicial: preferencia guardada o idioma del navegador.
        (function () {
            var lang = localStorage.getItem('lang');
            if (!lang) {
                var userLang = navigator.language || navigator.userLanguage || '';
                lang = userLang.toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
            }
            document.documentElement.setAttribute('lang', lang);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - Mesgot</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Fonts: Roboto & Poppins to simulate Google/Flutter look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* Material Design 3 Dark Theme Colors */
            --md-sys-color-background: #121214;
            --md-sys-color-on-background: #E6E1E5;
            --md-sys-color-surface: #1E1D24;
            --md-sys-color-on-surface: #E6E1E5;
            --md-sys-color-primary: #D0BCFF; /* Purple MD3 Dark Mode */
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-outline: #938F99;
            --md-sys-color-outline-variant: #49454F;
            --md-sys-color-error: #F2B8B5;
            --md-sys-color-on-error: #601410;
            --md-sys-color-success: #B8E3B6;
            --md-sys-color-on-success: #1B3F1B;
            --md-sys-color-surface-variant: #49454F;
            --md-sys-color-on-surface-variant: #CAC4D0;

            --font-family-main: 'Roboto', sans-serif;
            --font-family-title: 'Poppins', sans-serif;
            --border-radius-card: 28px; /* Standard MD3 card corner radius */
            --border-radius-input: 12px;
            --border-radius-btn: 100px; /* Fully rounded buttons */
            --transition-speed: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-main);
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        /* --- Bilingüe: se muestra solo el idioma activo --- */
        html[lang="en"] .lang-es,
        html[lang="es"] .lang-en {
            display: none;
        }

        /* Flutter-like container (Card) */
        .flutter-card {
            background-color: var(--md-sys-color-surface);
            width: 100%;
            max-width: 420px;
            border-radius: var(--border-radius-card);
            padding: 32px 24px;
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.4), 0px 0px 2px rgba(255, 255, 255, 0.1);
            border: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform: translateY(10px);
            opacity: 0;
            animation: cardEntrance 0.6s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        @keyframes cardEntrance {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Simulador de AppBar estilo Flutter / Android */
        .md-appbar {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
            position: relative;
        }

        .md-back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: var(--md-sys-color-on-surface);
            text-decoration: none;
            background-color: transparent;
            border: none;
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }

        .md-back-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .md-appbar-title {
            font-family: var(--font-family-title);
            font-size: 20px;
            font-weight: 600;
            margin-left: 12px;
            color: var(--md-sys-color-on-surface);
        }

        /* Selector de idioma */
        .lang-toggle {
            margin-left: auto;
            background: none;
            border: 1px solid var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-on-surface-variant);
            font-family: var(--font-family-main);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border-radius: 100px;
            cursor: pointer;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        .lang-toggle:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--md-sys-color-primary);
        }

        /* Header Illustration / Icon */
        .illustration-icon {
            width: 72px;
            height: 72px;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
        }

        /* Subtitle */
        .view-description {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.5;
            padding: 0 8px;
        }

        /* Form */
        form {
            width: 100%;
        }

        /* MD3 Outlined TextField */
        .md-textfield {
            position: relative;
            margin-bottom: 24px;
            width: 100%;
        }

        .md-textfield input {
            width: 100%;
            height: 56px;
            padding: 16px 16px 16px 48px;
            font-size: 16px;
            font-family: var(--font-family-main);
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--border-radius-input);
            background-color: transparent;
            color: var(--md-sys-color-on-surface);
            outline: none;
            transition: border-color var(--transition-speed), border-width 0.1s;
        }

        .md-textfield input:focus {
            border-color: var(--md-sys-color-primary);
            border-width: 2px;
        }

        .md-textfield-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 20px;
            pointer-events: none;
            transition: color var(--transition-speed);
        }

        .md-textfield input:focus ~ .md-textfield-icon {
            color: var(--md-sys-color-primary);
        }

        .md-textfield label {
            position: absolute;
            left: 48px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--md-sys-color-surface);
            padding: 0 6px;
            color: var(--md-sys-color-on-surface-variant);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), top 0.15s, left 0.15s, font-size 0.15s, color var(--transition-speed);
            pointer-events: none;
            font-size: 16px;
        }

        /* Label floating state when input focused or filled */
        .md-textfield input:focus ~ label,
        .md-textfield input:not(:placeholder-shown) ~ label {
            top: 0;
            left: 14px;
            font-size: 12px;
            color: var(--md-sys-color-primary);
            transform: translateY(-50%);
        }

        /* Buttons (Filled Button MD3 Style) */
        .md-btn {
            width: 100%;
            height: 52px;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: var(--border-radius-btn);
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-family-title);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            transition: opacity var(--transition-speed), transform 0.1s, box-shadow var(--transition-speed), background-color var(--transition-speed);
            position: relative;
        }

        .md-btn:hover:not(:disabled) {
            box-shadow: 0px 6px 16px rgba(0, 0, 0, 0.25);
            background-color: #E2D3FF; /* Lighter primary */
        }

        .md-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .md-btn:disabled {
            background-color: var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-outline);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* CircularProgressIndicator (Flutter-like spinner) */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--md-sys-color-on-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .md-btn.loading .btn-text,
        .md-btn.loading i {
            display: none;
        }

        .md-btn.loading .spinner {
            display: block;
        }

        /* Google Adsense placeholder (styled politely to fit UI) */
        .ads-container {
            margin-top: 24px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Floating SnackBar (Flutter-like) */
        .md-snackbar {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #313033; /* Material Design 3 Inverse Surface */
            color: #F4EFF4; /* Inverse On Surface */
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 320px;
            max-width: 90%;
            z-index: 1000;
            transition: bottom 0.35s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .md-snackbar.show {
            bottom: 24px;
        }

        .md-snackbar-text {
            font-size: 14px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .md-snackbar-icon {
            margin-right: 12px;
            font-size: 18px;
        }

        .md-snackbar.success .md-snackbar-icon {
            color: var(--md-sys-color-success);
        }

        .md-snackbar.error .md-snackbar-icon {
            color: var(--md-sys-color-error);
        }

        .md-snackbar-close {
            background: none;
            border: none;
            color: var(--md-sys-color-primary);
            cursor: pointer;
            margin-left: 12px;
            padding: 4px;
            font-size: 14px;
            border-radius: 50%;
            transition: background-color var(--transition-speed);
        }

        .md-snackbar-close:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }
    </style>
    <!-- Google AdSense script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1688105000086651" crossorigin="anonymous"></script>
</head>
<body>

    <div class="flutter-card">
        <!-- Simulador de AppBar -->
        <div class="md-appbar">
            <a href="index.html" class="md-back-btn" title="Volver al inicio">
                <i class="fas fa-arrow-left"></i>
            </a>
            <span class="md-appbar-title">
                <span class="lang-es">Recuperación</span>
                <span class="lang-en">Recovery</span>
            </span>
            <button type="button" id="lang-toggle" class="lang-toggle">
                <span class="lang-es">EN</span>
                <span class="lang-en">ES</span>
            </button>
        </div>

        <!-- VISTA: SOLICITAR ENLACE DE RECUPERACIÓN -->
        <div id="request-view" style="width: 100%;">
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div class="illustration-icon">
                    <i class="fas fa-key"></i>
                </div>
                <p class="view-description">
                    <span class="lang-es">Introduce tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</span>
                    <span class="lang-en">Enter your email address and we will send you a link to reset your password.</span>
                </p>
            </div>

            <form id="request-form" novalidate>
                <div class="md-textfield">
                    <i class="fas fa-envelope md-textfield-icon"></i>
                    <input type="email" id="reset-email" placeholder=" " required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
                    <label for="reset-email">
                        <span class="lang-es">Correo electrónico</span>
                        <span class="lang-en">Email address</span>
                    </label>
                </div>
                <button type="submit" id="request-btn" class="md-btn">
                    <i class="fas fa-paper-plane"></i>
                    <span class="btn-text">
                        <span class="lang-es">Enviar enlace</span>
                        <span class="lang-en">Send link</span>
                    </span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Ad Container -->
        <div class="ads-container">
            <!-- AdPlaceholder -->
            <ins class="adsbygoogle"
                 style="display:block; text-align:center;"
                 data-ad-layout="in-article"
                 data-ad-format="fluid"
                 data-ad-client="ca-pub-1688105000086651"
                 data-ad-slot="YOUR_AD_SLOT"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <!-- Floating SnackBar (Flutter-style notification) -->
    <div id="snackbar" class="md-snackbar" role="status" aria-live="polite">
        <i id="snackbar-icon" class="fas fa-info-circle md-snackbar-icon"></i>
        <span id="snackbar-text" class="md-snackbar-text"></span>
        <button id="snackbar-close" class="md-snackbar-close" aria-label="Cerrar">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script>
        // --- CONFIGURACIÓN DE SUPABASE ---
        var SUPABASE_URL = 'https://ifvxhywcfxsobupctezb.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmdnhoeXdjZnhzb2J1cGN0ZXpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk5MDg3MzAsImV4cCI6MjA2NTQ4NDczMH0.hrpnJSZQrPvsrpR3EloWuQgNOo_tMO7CY5t5C1Vdzg8';

        // Página a la que llega el usuario desde el correo. Fija a propósito:
        // una URL dinámica se sale de la lista blanca de Supabase sin avisar.
        var REDIRECT_TO = 'https://mesgot.com/newpassword.html';

        // --- TEXTOS DINÁMICOS ---
        var STRINGS = {
            es: {
                emailRequired: 'Introduce tu correo electrónico.',
                emailInvalid: 'Introduce un correo electrónico válido.',
                sent: 'Si existe una cuenta con ese correo, te hemos enviado un enlace para restablecer la contraseña. Revisa tu bandeja de entrada y la carpeta de spam.',
                rateLimit: 'Has solicitado demasiados correos. Espera unos minutos e inténtalo de nuevo.',
                network: 'No hay conexión con el servidor. Comprueba tu conexión e inténtalo de nuevo.',
                generic: 'No se pudo enviar el enlace. Inténtalo de nuevo.',
                loadFailed: 'No se pudo cargar el servicio de autenticación. Recarga la página e inténtalo de nuevo.'
            },
            en: {
                emailRequired: 'Enter your email address.',
                emailInvalid: 'Enter a valid email address.',
                sent: 'If an account exists for that address, we have sent a link to reset your password. Check your inbox and your spam folder.',
                rateLimit: 'You have requested too many emails. Please wait a few minutes and try again.',
                network: 'No connection to the server. Check your connection and try again.',
                generic: 'The link could not be sent. Please try again.',
                loadFailed: 'The authentication service could not be loaded. Reload the page and try again.'
            }
        };

        function lang() {
            return document.documentElement.getAttribute('lang') === 'en' ? 'en' : 'es';
        }

        function t(key) {
            return STRINGS[lang()][key];
        }

        // --- REFERENCIAS DOM ---
        var requestForm = document.getElementById('request-form');
        var emailInput = document.getElementById('reset-email');
        var snackbar = document.getElementById('snackbar');
        var snackbarText = document.getElementById('snackbar-text');
        var snackbarIcon = document.getElementById('snackbar-icon');
        var snackbarClose = document.getElementById('snackbar-close');
        var snackbarTimeout;

        // --- SNACKBAR ---
        function showSnackBar(message, type) {
            clearTimeout(snackbarTimeout);
            snackbarText.textContent = message;

            if (type === 'success') {
                snackbarIcon.className = 'fas fa-check-circle md-snackbar-icon';
                snackbar.className = 'md-snackbar show success';
            } else if (type === 'error') {
                snackbarIcon.className = 'fas fa-exclamation-circle md-snackbar-icon';
                snackbar.className = 'md-snackbar show error';
            } else {
                snackbarIcon.className = 'fas fa-info-circle md-snackbar-icon';
                snackbar.className = 'md-snackbar show';
            }

            snackbarTimeout = setTimeout(hideSnackBar, 8000);
        }

        function hideSnackBar() {
            snackbar.classList.remove('show');
        }

        snackbarClose.addEventListener('click', hideSnackBar);

        // --- ESTADO DE CARGA ---
        function setLoadingState(isLoading, buttonId) {
            var btn = document.getElementById(buttonId);
            if (!btn) return;
            if (isLoading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // --- SELECTOR DE IDIOMA ---
        document.getElementById('lang-toggle').addEventListener('click', function () {
            var next = lang() === 'es' ? 'en' : 'es';
            document.documentElement.setAttribute('lang', next);
            localStorage.setItem('lang', next);
        });

        // --- CLIENTE DE SUPABASE ---
        // flowType 'implicit': el enlace del correo vuelve con los tokens en el
        // fragmento, así que funciona aunque el correo se abra en otro dispositivo.
        // Con PKCE (el valor por defecto) el verificador queda en este navegador
        // y el flujo entre dispositivos sería imposible.
        var db = null;
        try {
            if (typeof supabase === 'undefined' || !supabase.createClient) {
                throw new Error('supabase-js no disponible');
            }
            db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    flowType: 'implicit',
                    persistSession: false,
                    autoRefreshToken: false,
                    detectSessionInUrl: false
                }
            });
        } catch (err) {
            console.error('No se pudo inicializar Supabase:', err);
        }

        // --- ENVÍO DEL FORMULARIO ---
        var isSubmitting = false;

        requestForm.addEventListener('submit', function (event) {
            event.preventDefault();

            if (isSubmitting) return;

            var email = emailInput.value.trim();

            if (!email) {
                showSnackBar(t('emailRequired'), 'error');
                emailInput.focus();
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showSnackBar(t('emailInvalid'), 'error');
                emailInput.focus();
                return;
            }
            if (!db) {
                showSnackBar(t('loadFailed'), 'error');
                return;
            }

            isSubmitting = true;
            setLoadingState(true, 'request-btn');

            db.auth.resetPasswordForEmail(email, { redirectTo: REDIRECT_TO })
                .then(function (res) {
                    var error = res && res.error;
                    if (!error) {
                        showSnackBar(t('sent'), 'success');
                        requestForm.reset();
                        return;
                    }

                    console.error('resetPasswordForEmail:', error);
                    var code = error.code || '';
                    var msg = (error.message || '').toLowerCase();

                    if (code === 'over_email_send_rate_limit' || error.status === 429 || msg.indexOf('rate limit') !== -1 || msg.indexOf('after') !== -1) {
                        showSnackBar(t('rateLimit'), 'error');
                    } else if (msg.indexOf('failed to fetch') !== -1 || msg.indexOf('network') !== -1) {
                        showSnackBar(t('network'), 'error');
                    } else {
                        // No revelamos si la cuenta existe: mensaje genérico.
                        showSnackBar(t('generic'), 'error');
                    }
                })
                .catch(function (err) {
                    console.error('resetPasswordForEmail lanzó una excepción:', err);
                    showSnackBar(t('network'), 'error');
                })
                .then(function () {
                    isSubmitting = false;
                    setLoadingState(false, 'request-btn');
                });
        });
    </script>
</body>
</html>
