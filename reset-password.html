<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - NotasPro</title>
    <!-- Fonts: Roboto & Poppins to simulate Google/Flutter look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* Material Design 3 Dark Theme Colors */
            --md-sys-color-background: #121214;
            --md-sys-color-on-background: #E6E1E5;
            --md-sys-color-surface: #1E1D24;
            --md-sys-color-on-surface: #E6E1E5;
            --md-sys-color-primary: #D0BCFF; /* Purple MD3 Dark Mode */
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-outline: #938F99;
            --md-sys-color-outline-variant: #49454F;
            --md-sys-color-error: #F2B8B5;
            --md-sys-color-on-error: #601410;
            --md-sys-color-success: #B8E3B6;
            --md-sys-color-on-success: #1B3F1B;
            --md-sys-color-surface-variant: #49454F;
            --md-sys-color-on-surface-variant: #CAC4D0;

            --font-family-main: 'Roboto', sans-serif;
            --font-family-title: 'Poppins', sans-serif;
            --border-radius-card: 28px; /* Standard MD3 card corner radius */
            --border-radius-input: 12px;
            --border-radius-btn: 100px; /* Fully rounded buttons */
            --transition-speed: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-main);
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
        }

        /* Flutter-like container (Card) */
        .flutter-card {
            background-color: var(--md-sys-color-surface);
            width: 100%;
            max-width: 420px;
            border-radius: var(--border-radius-card);
            padding: 32px 24px;
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.4), 0px 0px 2px rgba(255, 255, 255, 0.1);
            border: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform: translateY(10px);
            opacity: 0;
            animation: cardEntrance 0.6s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
        }

        @keyframes cardEntrance {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Simulador de AppBar estilo Flutter / Android */
        .md-appbar {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
            position: relative;
        }

        .md-back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: var(--md-sys-color-on-surface);
            text-decoration: none;
            background-color: transparent;
            border: none;
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }

        .md-back-btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .md-appbar-title {
            font-family: var(--font-family-title);
            font-size: 20px;
            font-weight: 600;
            margin-left: 12px;
            color: var(--md-sys-color-on-surface);
        }

        /* Header Illustration / Icon */
        .illustration-icon {
            width: 72px;
            height: 72px;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
        }

        /* Subtitle */
        .view-description {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.5;
            padding: 0 8px;
        }

        /* Form */
        form {
            width: 100%;
        }

        /* MD3 Outlined TextField */
        .md-textfield {
            position: relative;
            margin-bottom: 24px;
            width: 100%;
        }

        .md-textfield input {
            width: 100%;
            height: 56px;
            padding: 16px 16px 16px 48px;
            font-size: 16px;
            font-family: var(--font-family-main);
            border: 1px solid var(--md-sys-color-outline);
            border-radius: var(--border-radius-input);
            background-color: transparent;
            color: var(--md-sys-color-on-surface);
            outline: none;
            transition: border-color var(--transition-speed), border-width 0.1s;
        }

        .md-textfield input:focus {
            border-color: var(--md-sys-color-primary);
            border-width: 2px;
        }

        .md-textfield-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--md-sys-color-on-surface-variant);
            font-size: 20px;
            pointer-events: none;
            transition: color var(--transition-speed);
        }

        .md-textfield input:focus ~ .md-textfield-icon {
            color: var(--md-sys-color-primary);
        }

        .md-textfield label {
            position: absolute;
            left: 48px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--md-sys-color-surface);
            padding: 0 6px;
            color: var(--md-sys-color-on-surface-variant);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), top 0.15s, left 0.15s, font-size 0.15s, color var(--transition-speed);
            pointer-events: none;
            font-size: 16px;
        }

        /* Label floating state when input focused or filled */
        .md-textfield input:focus ~ label,
        .md-textfield input:not(:placeholder-shown) ~ label {
            top: 0;
            left: 14px;
            font-size: 12px;
            color: var(--md-sys-color-primary);
            transform: translateY(-50%);
        }

        /* Buttons (Filled Button MD3 Style) */
        .md-btn {
            width: 100%;
            height: 52px;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: var(--border-radius-btn);
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font-family-title);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            transition: opacity var(--transition-speed), transform 0.1s, box-shadow var(--transition-speed), background-color var(--transition-speed);
            position: relative;
        }

        .md-btn:hover:not(:disabled) {
            box-shadow: 0px 6px 16px rgba(0, 0, 0, 0.25);
            background-color: #E2D3FF; /* Lighter primary */
        }

        .md-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .md-btn:disabled {
            background-color: var(--md-sys-color-outline-variant);
            color: var(--md-sys-color-outline);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* CircularProgressIndicator (Flutter-like spinner) */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--md-sys-color-on-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .md-btn.loading .btn-text,
        .md-btn.loading i {
            display: none;
        }

        .md-btn.loading .spinner {
            display: block;
        }

        /* Google Adsense placeholder (styled politely to fit UI) */
        .ads-container {
            margin-top: 24px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Floating SnackBar (Flutter-like) */
        .md-snackbar {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #313033; /* Material Design 3 Inverse Surface */
            color: #F4EFF4; /* Inverse On Surface */
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 320px;
            max-width: 90%;
            z-index: 1000;
            transition: bottom 0.35s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .md-snackbar.show {
            bottom: 24px;
        }

        .md-snackbar-text {
            font-size: 14px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .md-snackbar-icon {
            margin-right: 12px;
            font-size: 18px;
        }

        .md-snackbar.success .md-snackbar-icon {
            color: var(--md-sys-color-success);
        }

        .md-snackbar.error .md-snackbar-icon {
            color: var(--md-sys-color-error);
        }

        .md-snackbar-close {
            background: none;
            border: none;
            color: var(--md-sys-color-primary);
            cursor: pointer;
            margin-left: 12px;
            padding: 4px;
            font-size: 14px;
            border-radius: 50%;
            transition: background-color var(--transition-speed);
        }

        .md-snackbar-close:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }
    </style>
    <!-- Google AdSense script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1688105000086651" crossorigin="anonymous"></script>
</head>
<body>

    <div class="flutter-card">
        <!-- Simulador de AppBar -->
        <div class="md-appbar">
            <a href="login.html" class="md-back-btn" title="Volver al Login">
                <i class="fas fa-arrow-left"></i>
            </a>
            <span class="md-appbar-title">Recuperación</span>
        </div>

        <!-- VISTA 1: SOLICITAR ENLACE DE RECUPERACIÓN -->
        <div id="request-view" style="width: 100%;">
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div class="illustration-icon">
                    <i class="fas fa-key"></i>
                </div>
                <p class="view-description">
                    Introduce tu correo electrónico para enviarte las instrucciones y restablecer tu contraseña.
                </p>
            </div>
            
            <form id="request-form">
                <div class="md-textfield">
                    <i class="fas fa-envelope md-textfield-icon"></i>
                    <input type="email" id="reset-email" placeholder=" " required autocomplete="email">
                    <label for="reset-email">Correo Electrónico</label>
                </div>
                <button type="submit" id="request-btn" class="md-btn">
                    <i class="fas fa-paper-plane"></i>
                    <span class="btn-text">Enviar Enlace</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- VISTA 2: ESTABLECER NUEVA CONTRASEÑA -->
        <div id="update-view" style="width: 100%; display: none;">
            <div style="display: flex; flex-direction: column; align-items: center; width: 100%;">
                <div class="illustration-icon" style="background-color: rgba(208, 188, 255, 0.2); color: var(--md-sys-color-primary);">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <p class="view-description">
                    Establece tu nueva contraseña de acceso. Asegúrate de que tenga al menos 6 caracteres.
                </p>
            </div>
            
            <form id="update-form">
                <div class="md-textfield">
                    <i class="fas fa-lock md-textfield-icon"></i>
                    <input type="password" id="new-password" placeholder=" " required autocomplete="new-password">
                    <label for="new-password">Nueva Contraseña</label>
                </div>
                <div class="md-textfield">
                    <i class="fas fa-check-double md-textfield-icon"></i>
                    <input type="password" id="confirm-password" placeholder=" " required autocomplete="new-password">
                    <label for="confirm-password">Confirmar Contraseña</label>
                </div>
                <button type="submit" id="update-btn" class="md-btn">
                    <i class="fas fa-save"></i>
                    <span class="btn-text">Guardar Contraseña</span>
                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <!-- Ad Container -->
        <div class="ads-container">
            <!-- AdPlaceholder -->
            <ins class="adsbygoogle"
                 style="display:block; text-align:center;"
                 data-ad-layout="in-article"
                 data-ad-format="fluid"
                 data-ad-client="ca-pub-1688105000086651"
                 data-ad-slot="YOUR_AD_SLOT"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <!-- Floating SnackBar (Flutter-style notification) -->
    <div id="snackbar" class="md-snackbar">
        <i id="snackbar-icon" class="fas fa-info-circle md-snackbar-icon"></i>
        <span id="snackbar-text" class="md-snackbar-text"></span>
        <button id="snackbar-close" class="md-snackbar-close">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <script type="module">
        // --- CONFIGURACIÓN DE SUPABASE ---
        const SUPABASE_URL = 'https://ifvxhywcfxsobupctezb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmdnhoeXdjZnhzb2J1cGN0ZXpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk5MDg3MzAsImV4cCI6MjA2NTQ4NDczMH0.hrpnJSZQrPvsrpR3EloWuQgNOo_tMO7CY5t5C1Vdzg8';
        
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- REFERENCIAS DOM ---
        const requestView = document.getElementById('request-view');
        const updateView = document.getElementById('update-view');
        const requestForm = document.getElementById('request-form');
        const updateForm = document.getElementById('update-form');
        const emailInput = document.getElementById('reset-email');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        
        const snackbar = document.getElementById('snackbar');
        const snackbarText = document.getElementById('snackbar-text');
        const snackbarIcon = document.getElementById('snackbar-icon');
        const snackbarClose = document.getElementById('snackbar-close');
        let snackbarTimeout;

        // --- SNACKBAR CONTROLLER ---
        function showSnackBar(message, type = 'success') {
            clearTimeout(snackbarTimeout);
            snackbarText.textContent = message;
            
            // Icon according to notification type
            if (type === 'success') {
                snackbarIcon.className = 'fas fa-check-circle md-snackbar-icon';
                snackbar.className = 'md-snackbar show success';
            } else if (type === 'error') {
                snackbarIcon.className = 'fas fa-exclamation-circle md-snackbar-icon';
                snackbar.className = 'md-snackbar show error';
            } else {
                snackbarIcon.className = 'fas fa-info-circle md-snackbar-icon';
                snackbar.className = 'md-snackbar show';
            }
            
            snackbarTimeout = setTimeout(() => {
                hideSnackBar();
            }, 6000); // 6 seconds visibility
        }

        // --- LOADING STATE CONTROLLER ---
        function setLoadingState(isLoading, buttonId) {
            const btn = document.getElementById(buttonId);
            if (!btn) return;
            
            if (isLoading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // --- HASH PARSER ---
        function getHashParams() {
            const hash = window.location.hash.substring(1);
            if (!hash) return {};
            return hash.split('&').reduce((acc, item) => {
                const [key, value] = item.split('=');
                if (key && value) {
                    acc[key] = decodeURIComponent(value);
                }
                return acc;
            }, {});
        }

        function hideSnackBar() {
            snackbar.classList.remove('show');
        }

        snackbarClose.addEventListener('click', hideSnackBar);

        // --- LÓGICA PRINCIPAL Y FLUJOS ---

        // 1. Inicialización e interceptación del token
        async function checkInitialRecoveryState() {
            try {
                const params = getHashParams();
                console.log("Parámetros hash detectados:", params);

                // Si hay un token de acceso y un token de refresco en el fragmento hash,
                // forzamos al cliente de Supabase a establecer la sesión activamente.
                if (params.access_token && params.refresh_token) {
                    const { data, error } = await db.auth.setSession({
                        access_token: params.access_token,
                        refresh_token: params.refresh_token
                    });
                    if (error) {
                        console.error("Fallo al establecer la sesión manualmente:", error.message);
                    } else {
                        console.log("Sesión de recuperación establecida de forma manual con éxito");
                    }
                }

                // Consultamos la sesión actual en el cliente
                const { data: { session }, error } = await db.auth.getSession();
                if (error) throw error;

                // Si viene explícitamente como tipo 'recovery', o hay tokens, o existe un usuario en sesión
                const isRecovery = params.type === 'recovery' || params.access_token || (session && session.user);

                if (isRecovery) {
                    requestView.style.display = 'none';
                    updateView.style.display = 'block';
                    showSnackBar('Sesión verificada de forma segura. Ingresa tu nueva contraseña.', 'success');
                }
            } catch (err) {
                console.error("Error al procesar el estado de autenticación:", err);
                showSnackBar("No se pudo verificar la sesión de recuperación. Solicita un nuevo enlace.", "error");
            }
        }

        // Ejecutar comprobación al cargar
        checkInitialRecoveryState();

        // 2. Redundancia mediante Listener de Supabase
        db.auth.onAuthStateChanged((event, session) => {
            console.log("Evento AuthStateChanged:", event);
            if (event === 'PASSWORD_RECOVERY') {
                requestView.style.display = 'none';
                updateView.style.display = 'block';
                showSnackBar('Verificación de recuperación exitosa. Crea tu contraseña.', 'success');
            }
        });

        // 3. Formulario Vista 1: Solicitar Enlace
        requestForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = emailInput.value.trim();
            
            if (!email) {
                showSnackBar('Por favor, introduce un correo electrónico.', 'error');
                return;
            }

            setLoadingState(true, 'request-btn');

            // URL dinámica para que funcione tanto en producción (mesgot.com) como local (localhost)
            const redirectUrl = window.location.origin + window.location.pathname;
            console.log("Redirigiendo de vuelta a:", redirectUrl);

            const { error } = await db.auth.resetPasswordForEmail(email, {
                redirectTo: redirectUrl
            });

            if (error) {
                showSnackBar(`Error: ${error.message}`, 'error');
            } else {
                showSnackBar('Si existe una cuenta registrada, se ha enviado un enlace de recuperación. Revisa tu bandeja de entrada y spam.', 'success');
                requestForm.reset();
            }
            setLoadingState(false, 'request-btn');
        });

        // 4. Formulario Vista 2: Establecer Nueva Contraseña
        updateForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword.length < 6) {
                showSnackBar('La contraseña debe tener al menos 6 caracteres.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showSnackBar('Las contraseñas no coinciden.', 'error');
                return;
            }

            setLoadingState(true, 'update-btn');

            const { error } = await db.auth.updateUser({ password: newPassword });

            if (error) {
                showSnackBar(`Error al actualizar la contraseña: ${error.message}`, 'error');
            } else {
                showSnackBar('¡Contraseña actualizada con éxito! Redirigiendo al inicio de sesión...', 'success');
                updateView.style.display = 'none';
                
                // Cerramos sesión para limpiar los tokens locales del navegador
                await db.auth.signOut();
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3500);
            }
            setLoadingState(false, 'update-btn');
        });
    </script>
</body>
</html>
