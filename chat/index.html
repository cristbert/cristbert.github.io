    <!--
      Content-Security-Policy en meta (GitHub Pages no permite cabeceras HTTP).
      Nota: en <meta> se IGNORAN frame-ancestors, report-uri y sandbox; por eso no
      incluimos frame-ancestors aqui (se dejaria a una cabecera real si existiera).
      connect-src: solo el Supabase de produccion (https + wss para realtime).
      img-src: Supabase (media/avatars) + tiles de OpenStreetMap + data:/blob: (previews locales).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'self';
        form-action 'self';
        object-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self' data:;
        img-src 'self' data: blob: https://ifvxhywcfxsobupctezb.supabase.co https://*.tile.openstreetmap.org;
        connect-src 'self' https://ifvxhywcfxsobupctezb.supabase.co wss://ifvxhywcfxsobupctezb.supabase.co;
        worker-src 'self' blob:;
        manifest-src 'self';
        media-src 'self' blob: https://ifvxhywcfxsobupctezb.supabase.co
      "
    />
